name: Native Glass Globe Android 15
on:
  push:
    branches: [main]
    paths:
      - 'nativeglobe/**'
      - 'settings.gradle'
      - '.github/workflows/native-glass-globe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK / NDK / CMake
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build native Vulkan APK and SPIR-V
        run: gradle --no-daemon :nativeglobe:assembleDebug
      - name: Check Android 15 manifest, native binaries and shader assets
        shell: bash
        run: |
          set -euo pipefail
          APK=nativeglobe/build/outputs/apk/debug/nativeglobe-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt
          grep -F "sdkVersion:'35'" badging.txt
          grep -F "targetSdkVersion:'35'" badging.txt
          grep -F 'com.example.liquidglass.GlobeActivity' badging.txt
          unzip -l "$APK" | tee apk-files.txt
          grep -F 'lib/arm64-v8a/libliquidglass.so' apk-files.txt
          grep -F 'lib/x86_64/libliquidglass.so' apk-files.txt
          grep -F 'assets/shaders/globe.vert.spv' apk-files.txt
          grep -F 'assets/shaders/globe.frag.spv' apk-files.txt
          unzip -p "$APK" assets/shaders/globe.vert.spv > globe.vert.spv
          unzip -p "$APK" assets/shaders/globe.frag.spv > globe.frag.spv
          "$ANDROID_HOME/ndk/27.2.12479018/shader-tools/linux-x86_64/spirv-val" --target-env vulkan1.0 globe.vert.spv
          "$ANDROID_HOME/ndk/27.2.12479018/shader-tools/linux-x86_64/spirv-val" --target-env vulkan1.0 globe.frag.spv
      - name: Package and test standalone Gradle project
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/native-glass-globe-standalone"
          bash nativeglobe/scripts/assemble-standalone.sh "$OUT"
          test "$(grep -c "include ':nativeglobe'" "$OUT/settings.gradle")" = 1
          ! grep -Eq "include.*(:app|:jpegviewer)" "$OUT/settings.gradle"
          gradle --no-daemon -p "$OUT" wrapper --gradle-version 8.9 --distribution-type bin
          test -s "$OUT/gradle/wrapper/gradle-wrapper.jar"
          chmod +x "$OUT/gradlew"
          "$OUT/gradlew" --no-daemon -p "$OUT" :nativeglobe:assembleDebug
          test -s "$OUT/nativeglobe/build/outputs/apk/debug/nativeglobe-debug.apk"
          # Upload the project directory directly. Artifacts are ZIPs already:
          # uploading a second .zip produced an unnecessarily nested ZIP.
          STAGE="$RUNNER_TEMP/native-glass-globe-standalone-download"
          mkdir -p "$STAGE/nativeglobe"
          cp "$OUT/settings.gradle" "$OUT/build.gradle" "$OUT/gradle.properties" "$OUT/README.md" \
            "$OUT/gradlew" "$OUT/gradlew.bat" "$STAGE/"
          cp -a "$OUT/gradle" "$STAGE/"
          cp "$OUT/nativeglobe/build.gradle" "$OUT/nativeglobe/README.md" "$STAGE/nativeglobe/"
          cp -a "$OUT/nativeglobe/src" "$STAGE/nativeglobe/"
          grep -Fx "rootProject.name = 'native-glass-globe-android15'" "$STAGE/settings.gradle"
          test -s "$STAGE/gradle/wrapper/gradle-wrapper.jar"
          test -s "$STAGE/nativeglobe/src/main/shaders/globe.frag"
          test -s "$STAGE/nativeglobe/src/main/cpp/vulkan_core.cpp"
          test -s "$STAGE/nativeglobe/src/main/java/com/example/liquidglass/GlobeActivity.java"
          # Regression: downloaded artifact must contain project files directly, not an inner .zip.
          test "$(find "$STAGE" -name '*.zip' | wc -l)" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: native-glass-globe-android15-standalone-source
          path: ${{ runner.temp }}/native-glass-globe-standalone-download
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-glass-globe-android15-debug-apk
          path: nativeglobe/build/outputs/apk/debug/nativeglobe-debug.apk
          if-no-files-found: error
  android15-emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-glass-globe-android15-debug-apk
          path: dist
      - name: Start Android 15 and exercise native Activity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          script: |
            set -eu
            adb install -r dist/nativeglobe-debug.apk
            adb shell am start -W -n com.example.liquidglass/.GlobeActivity
            sleep 8
            adb shell dumpsys activity activities | grep -F 'com.example.liquidglass'
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml ui.xml
            grep -F 'Glass droplets: 24' ui.xml
            grep -F 'Fusion: 0.32' ui.xml
            grep -F 'Speed: 1.0' ui.xml
            grep -F 'Android 15' ui.xml
            adb shell screencap -p /sdcard/globe.png
            adb pull /sdcard/globe.png globe.png
            adb logcat -d -s LiquidGlass:I > vulkan-device.log || true
            cat vulkan-device.log
            adb shell pidof com.example.liquidglass
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-glass-globe-android15-emulator-evidence
          path: |
            globe.png
            ui.xml
            vulkan-device.log
          if-no-files-found: warn
