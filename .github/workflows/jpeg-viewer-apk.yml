name: JPEG Stream Viewer APK (Android 5.1+)

on:
  push:
    branches: [main]
    paths:
      - 'jpegviewer/**'
      - 'settings.gradle'
      - '.github/workflows/jpeg-viewer-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile standalone Android 5.1+ viewer
        run: gradle --no-daemon :jpegviewer:assembleDebug
      - name: Verify SDK bounds and launcher
        shell: bash
        run: |
          set -euo pipefail
          APK=jpegviewer/build/outputs/apk/debug/jpegviewer-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt
          grep -F "sdkVersion:'22'" badging.txt
          grep -F "launchable-activity: name='com.example.jpegstream.ViewerActivity'" badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jpeg-stream-viewer-android51-apk
          path: jpegviewer/build/outputs/apk/debug/jpegviewer-debug.apk
          if-no-files-found: error

  android51-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jpeg-stream-viewer-android51-apk
          path: dist
      - name: Install and launch on Android 5.1 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 22
          arch: x86
          target: default
          profile: Nexus 5
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r dist/jpegviewer-debug.apk
            adb shell am start -W -n com.example.jpegstream/.ViewerActivity
            sleep 2
            adb shell dumpsys activity activities | grep -F com.example.jpegstream
